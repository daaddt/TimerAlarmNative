          package com.trae.timeralarm;
          
          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.PowerManager;
          import android.os.Vibrator;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          
          public class AlarmActivity extends Activity {
              private final Handler handler = new Handler();
              private MediaPlayer player;
              private ToneGenerator toneGenerator;
              private Vibrator vibrator;
              private PowerManager.WakeLock wakeLock;
              private int round = 0;
              private int totalRounds = 1;
              private boolean testMode = false;
              private TextView title;
              private TextView roundText;
          
              private final Runnable stopOneRound = new Runnable() {
                  @Override
                  public void run() {
                      stopSound();
                      if (round >= totalRounds) {
                          finish();
                          return;
                      }
                      roundText.setText("间隔 1 分钟后继续提醒");
                      handler.postDelayed(startNextRound, 60 * 1000L);
                  }
              };
          
              private final Runnable startNextRound = new Runnable() {
                  @Override
                  public void run() {
                      startRound();
                  }
              };
          
              private final Runnable fallbackBeep = new Runnable() {
                  @Override
                  public void run() {
                      if (toneGenerator != null) {
                          toneGenerator.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 900);
                          handler.postDelayed(this, 1400);
                      }
                  }
              };
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (manager != null) {
                      manager.cancel(1001);
                  }
                  testMode = getIntent().getBooleanExtra("test", false);
                  prepareWindow();
                  acquireWakeLock();
                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  buildUi();
                  SharedPreferences pref = getSharedPreferences(AlarmStore.PREF, MODE_PRIVATE);
                  int alarmId = getIntent().getIntExtra("alarmId", -1);
                  AlarmItem item = AlarmStore.find(this, alarmId);
                  totalRounds = testMode ? 1 : item == null ? 1 : Math.max(1, Math.min(10, item.repeatCount));
                  if (testMode) {
                      startRound();
                  } else {
                      roundText.setText("闹钟正在后台响铃");
                  }
              }
          
              private void prepareWindow() {
                  Window window = getWindow();
                  window.addFlags(
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                                  | WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                                  | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                                  | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                  );
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  }
              }
          
              private void acquireWakeLock() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TimerAlarmNative:AlarmWakeLock");
                      wakeLock.acquire(10 * 60 * 1000L);
                  }
              }
          
              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(36, 36, 36, 36);
                  root.setBackgroundColor(0xff070a12);
          
                  title = new TextView(this);
                  title.setText(testMode ? "试听铃声" : "闹钟时间到");
                  title.setTextColor(0xffffffff);
                  title.setTextSize(34);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);
          
                  roundText = new TextView(this);
                  roundText.setTextColor(0xff7dd3fc);
                  roundText.setTextSize(22);
                  roundText.setGravity(Gravity.CENTER);
                  roundText.setPadding(0, 28, 0, 34);
                  root.addView(roundText);
          
                  Button stop = new Button(this);
                  stop.setText("关闭闹钟");
                  stop.setTextSize(20);
                  stop.setAllCaps(false);
                  stop.setOnClickListener(v -> {
                      Intent stopIntent = new Intent(this, AlarmRingingService.class);
                      stopIntent.setAction(AlarmRingingService.ACTION_STOP);
                      startService(stopIntent);
                      finish();
                  });
                  root.addView(stop);
          
                  setContentView(root);
              }
          
              private void startRound() {
                  round++;
                  roundText.setText("第 " + round + "/" + totalRounds + " 遍，默认响 5 分钟");
                  vibrateAlarm();
                  playSound();
                  handler.removeCallbacks(stopOneRound);
                  handler.postDelayed(stopOneRound, testMode ? 15 * 1000L : 5 * 60 * 1000L);
              }
          
              private void playSound() {
                  stopSound();
                  SharedPreferences pref = getSharedPreferences(AlarmStore.PREF, MODE_PRIVATE);
                  String saved = pref.getString("alarmSoundUri", "");
                  Uri[] candidates = new Uri[]{
                          saved.isEmpty() ? null : Uri.parse(saved),
                          Settings.System.DEFAULT_ALARM_ALERT_URI,
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM),
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE),
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  };
          
                  for (Uri uri : candidates) {
                      if (uri != null && tryPlayUri(uri)) {
                          return;
                      }
                  }
                  startFallbackBeep();
              }
          
              private boolean tryPlayUri(Uri uri) {
                  try {
                      player = new MediaPlayer();
                      player.setDataSource(this, uri);
                      if (Build.VERSION.SDK_INT >= 21) {
                          player.setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build());
                      } else {
                          player.setAudioStreamType(AudioManager.STREAM_ALARM);
                      }
                      player.setLooping(true);
                      player.prepare();
                      player.start();
                      return true;
                  } catch (Exception e) {
                      if (player != null) {
                          try {
                              player.release();
                          } catch (Exception ignored) {
                          }
                          player = null;
                      }
                      return false;
                  }
              }
          
              private void startFallbackBeep() {
                  try {
                      toneGenerator = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                      fallbackBeep.run();
                  } catch (Exception ignored) {
                  }
              }
          
              private void vibrateAlarm() {
                  if (vibrator == null) return;
                  try {
                      long[] pattern = new long[]{0, 700, 300, 700, 300, 700};
                      vibrator.vibrate(pattern, 0);
                  } catch (Exception ignored) {
                  }
              }
          
              private void stopSound() {
                  handler.removeCallbacks(fallbackBeep);
                  if (player != null) {
                      try {
                          if (player.isPlaying()) player.stop();
                          player.release();
                      } catch (Exception ignored) {
                      }
                      player = null;
                  }
                  if (toneGenerator != null) {
                      try {
                          toneGenerator.release();
                      } catch (Exception ignored) {
                      }
                      toneGenerator = null;
                  }
                  if (vibrator != null) {
                      try {
                          vibrator.cancel();
                      } catch (Exception ignored) {
                      }
                  }
              }
          
              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  handler.removeCallbacksAndMessages(null);
                  stopSound();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
              }
          }
