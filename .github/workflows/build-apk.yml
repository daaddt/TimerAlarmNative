name: 手机一键构建安卓 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成安卓项目源码
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'EOF_settings_gradle'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "TimerAlarmNative"
          include ":app"
          EOF_settings_gradle

          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'EOF_build_gradle'
          plugins {
              id "com.android.application" version "8.5.2" apply false
          }
          EOF_build_gradle

          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'EOF_app_build_gradle'
          plugins {
              id "com.android.application"
          }
          
          android {
              namespace "com.trae.timeralarm"
              compileSdk 35
          
              defaultConfig {
                  applicationId "com.trae.timeralarm"
                  minSdk 26
                  targetSdk 35
                  versionCode 6
                  versionName "1.5"
              }
          }
          EOF_app_build_gradle

          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_app_src_main_AndroidManifest_xml'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
          
              <application
                  android:allowBackup="true"
                  android:theme="@style/AppTheme"
                  android:label="计时器"
                  android:resizeableActivity="true"
                  android:supportsRtl="true">
          
                  <activity
                      android:name=".AlarmActivity"
                      android:exported="false"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:excludeFromRecents="true" />
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <receiver
                      android:name=".AlarmReceiver"
                      android:exported="false" />
          
                  <service
                      android:name=".AlarmRingingService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
          
                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_app_src_main_AndroidManifest_xml

          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          cat > 'app/src/main/res/values/styles.xml' <<'EOF_app_src_main_res_values_styles_xml'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#070A12</item>
                  <item name="android:navigationBarColor">#070A12</item>
                  <item name="android:colorAccent">#38BDF8</item>
              </style>
          </resources>
          EOF_app_src_main_res_values_styles_xml

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/AlarmItem.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/AlarmItem.java' <<'EOF_app_src_main_java_com_trae_timeralarm_AlarmItem_java'
          package com.trae.timeralarm;
          
          import org.json.JSONException;
          import org.json.JSONObject;
          
          import java.util.Calendar;
          
          public class AlarmItem {
              public int id;
              public int hour;
              public int minute;
              public int daysMask;
              public int repeatCount;
              public boolean enabled;
          
              public AlarmItem(int id, int hour, int minute, int daysMask, int repeatCount, boolean enabled) {
                  this.id = id;
                  this.hour = hour;
                  this.minute = minute;
                  this.daysMask = daysMask;
                  this.repeatCount = repeatCount;
                  this.enabled = enabled;
              }
          
              public boolean isOneTime() {
                  return daysMask == 0;
              }
          
              public long nextTriggerAfter(long nowMillis) {
                  Calendar now = Calendar.getInstance();
                  now.setTimeInMillis(nowMillis);
                  for (int offset = 0; offset <= 7; offset++) {
                      Calendar target = Calendar.getInstance();
                      target.setTimeInMillis(nowMillis);
                      target.add(Calendar.DAY_OF_YEAR, offset);
                      target.set(Calendar.HOUR_OF_DAY, hour);
                      target.set(Calendar.MINUTE, minute);
                      target.set(Calendar.SECOND, 0);
                      target.set(Calendar.MILLISECOND, 0);
          
                      if (target.getTimeInMillis() <= nowMillis) continue;
                      if (isOneTime()) return target.getTimeInMillis();
          
                      int dow = target.get(Calendar.DAY_OF_WEEK);
                      int mondayBased = (dow + 5) % 7;
                      if ((daysMask & (1 << mondayBased)) != 0) {
                          return target.getTimeInMillis();
                      }
                  }
                  return 0;
              }
          
              public String repeatText() {
                  if (daysMask == 0) return "仅一次";
                  String[] names = {"周一", "周二", "周三", "周四", "周五", "周六", "周日"};
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 7; i++) {
                      if ((daysMask & (1 << i)) != 0) {
                          if (sb.length() > 0) sb.append("、");
                          sb.append(names[i]);
                      }
                  }
                  return sb.toString();
              }
          
              public JSONObject toJson() throws JSONException {
                  JSONObject obj = new JSONObject();
                  obj.put("id", id);
                  obj.put("hour", hour);
                  obj.put("minute", minute);
                  obj.put("daysMask", daysMask);
                  obj.put("repeatCount", repeatCount);
                  obj.put("enabled", enabled);
                  return obj;
              }
          
              public static AlarmItem fromJson(JSONObject obj) {
                  return new AlarmItem(
                          obj.optInt("id"),
                          obj.optInt("hour", 7),
                          obj.optInt("minute", 0),
                          obj.optInt("daysMask", 0),
                          Math.max(1, Math.min(10, obj.optInt("repeatCount", 3))),
                          obj.optBoolean("enabled", true)
                  );
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_AlarmItem_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/AlarmStore.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/AlarmStore.java' <<'EOF_app_src_main_java_com_trae_timeralarm_AlarmStore_java'
          package com.trae.timeralarm;
          
          import android.content.Context;
          import android.content.SharedPreferences;
          
          import org.json.JSONArray;
          import org.json.JSONException;
          
          import java.util.ArrayList;
          import java.util.List;
          
          public class AlarmStore {
              public static final String PREF = "timer_alarm_pref";
              private static final String KEY_ALARMS = "alarmsJson";
              private static final String KEY_NEXT_ID = "nextAlarmId";
          
              public static List<AlarmItem> load(Context context) {
                  SharedPreferences pref = context.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                  List<AlarmItem> items = new ArrayList<>();
                  String raw = pref.getString(KEY_ALARMS, "[]");
                  try {
                      JSONArray array = new JSONArray(raw);
                      for (int i = 0; i < array.length(); i++) {
                          items.add(AlarmItem.fromJson(array.getJSONObject(i)));
                      }
                  } catch (Exception ignored) {
                  }
                  return items;
              }
          
              public static void save(Context context, List<AlarmItem> items) {
                  JSONArray array = new JSONArray();
                  for (AlarmItem item : items) {
                      try {
                          array.put(item.toJson());
                      } catch (JSONException ignored) {
                      }
                  }
                  context.getSharedPreferences(PREF, Context.MODE_PRIVATE)
                          .edit()
                          .putString(KEY_ALARMS, array.toString())
                          .apply();
              }
          
              public static int nextId(Context context) {
                  SharedPreferences pref = context.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                  int id = pref.getInt(KEY_NEXT_ID, 1);
                  pref.edit().putInt(KEY_NEXT_ID, id + 1).apply();
                  return id;
              }
          
              public static AlarmItem find(Context context, int id) {
                  for (AlarmItem item : load(context)) {
                      if (item.id == id) return item;
                  }
                  return null;
              }
          
              public static void disableOneTime(Context context, int id) {
                  List<AlarmItem> items = load(context);
                  for (AlarmItem item : items) {
                      if (item.id == id && item.isOneTime()) {
                          item.enabled = false;
                      }
                  }
                  save(context, items);
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_AlarmStore_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/AlarmScheduler.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/AlarmScheduler.java' <<'EOF_app_src_main_java_com_trae_timeralarm_AlarmScheduler_java'
          package com.trae.timeralarm;
          
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          
          import java.util.List;
          
          public class AlarmScheduler {
              public static void scheduleAll(Context context) {
                  List<AlarmItem> items = AlarmStore.load(context);
                  for (AlarmItem item : items) {
                      cancel(context, item.id);
                      if (item.enabled) schedule(context, item);
                  }
              }
          
              public static void schedule(Context context, AlarmItem item) {
                  if (!item.enabled) {
                      cancel(context, item.id);
                      return;
                  }
                  long triggerAt = item.nextTriggerAfter(System.currentTimeMillis());
                  if (triggerAt <= 0) return;
          
                  AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarmManager == null) return;
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) {
                      Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                      intent.setData(Uri.parse("package:" + context.getPackageName()));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(intent);
                      return;
                  }
          
                  Intent receiverIntent = new Intent(context, AlarmReceiver.class);
                  receiverIntent.putExtra("alarmId", item.id);
                  PendingIntent operation = PendingIntent.getBroadcast(
                          context,
                          item.id,
                          receiverIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
          
                  Intent showIntent = new Intent(context, AlarmActivity.class);
                  showIntent.putExtra("alarmId", item.id);
                  PendingIntent showPendingIntent = PendingIntent.getActivity(
                          context,
                          100000 + item.id,
                          showIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
          
                  AlarmManager.AlarmClockInfo info = new AlarmManager.AlarmClockInfo(triggerAt, showPendingIntent);
                  alarmManager.setAlarmClock(info, operation);
              }
          
              public static void cancel(Context context, int alarmId) {
                  AlarmManager alarmManager = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (alarmManager == null) return;
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  intent.putExtra("alarmId", alarmId);
                  PendingIntent operation = PendingIntent.getBroadcast(
                          context,
                          alarmId,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  alarmManager.cancel(operation);
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_AlarmScheduler_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/AlarmReceiver.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/AlarmReceiver.java' <<'EOF_app_src_main_java_com_trae_timeralarm_AlarmReceiver_java'
          package com.trae.timeralarm;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  int alarmId = intent.getIntExtra("alarmId", -1);
                  AlarmItem item = AlarmStore.find(context, alarmId);
                  if (item == null || !item.enabled) return;
          
                  Intent serviceIntent = new Intent(context, AlarmRingingService.class);
                  serviceIntent.setAction(AlarmRingingService.ACTION_START);
                  serviceIntent.putExtra("alarmId", alarmId);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent);
                  } else {
                      context.startService(serviceIntent);
                  }
          
                  if (item.isOneTime()) {
                      AlarmStore.disableOneTime(context, alarmId);
                      AlarmScheduler.cancel(context, alarmId);
                  } else {
                      AlarmScheduler.schedule(context, item);
                  }
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_AlarmReceiver_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/AlarmRingingService.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/AlarmRingingService.java' <<'EOF_app_src_main_java_com_trae_timeralarm_AlarmRingingService_java'
          package com.trae.timeralarm;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Vibrator;
          import android.provider.Settings;
          
          public class AlarmRingingService extends Service {
              public static final String ACTION_START = "com.trae.timeralarm.START_ALARM";
              public static final String ACTION_STOP = "com.trae.timeralarm.STOP_ALARM";
              private static final String CHANNEL_ID = "alarm_ringing";
              private final Handler handler = new Handler();
              private MediaPlayer player;
              private ToneGenerator toneGenerator;
              private Vibrator vibrator;
              private int alarmId = -1;
              private int round = 0;
              private int totalRounds = 1;
          
              private final Runnable stopOneRound = new Runnable() {
                  @Override
                  public void run() {
                      stopSound();
                      if (round >= totalRounds) {
                          stopSelf();
                          return;
                      }
                      handler.postDelayed(startNextRound, 60 * 1000L);
                  }
              };
          
              private final Runnable startNextRound = new Runnable() {
                  @Override
                  public void run() {
                      startRound();
                  }
              };
          
              private final Runnable fallbackBeep = new Runnable() {
                  @Override
                  public void run() {
                      if (toneGenerator != null) {
                          toneGenerator.startTone(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 900);
                          handler.postDelayed(this, 1400);
                      }
                  }
              };
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  alarmId = intent == null ? -1 : intent.getIntExtra("alarmId", -1);
                  AlarmItem item = AlarmStore.find(this, alarmId);
                  totalRounds = item == null ? 1 : Math.max(1, Math.min(10, item.repeatCount));
                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  startForeground(1001, buildNotification());
                  startRound();
                  return START_NOT_STICKY;
              }
          
              private Notification buildNotification() {
                  NotificationManager manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager != null) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "闹钟响铃", NotificationManager.IMPORTANCE_HIGH);
                      channel.setDescription("用于后台响铃和锁屏提醒");
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      channel.enableVibration(true);
                      manager.createNotificationChannel(channel);
                  }
          
                  Intent openIntent = new Intent(this, AlarmActivity.class);
                  openIntent.putExtra("alarmId", alarmId);
                  PendingIntent fullScreenIntent = PendingIntent.getActivity(
                          this,
                          3001,
                          openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
          
                  Intent stopIntent = new Intent(this, AlarmRingingService.class);
                  stopIntent.setAction(ACTION_STOP);
                  PendingIntent stopPendingIntent = PendingIntent.getService(
                          this,
                          3002,
                          stopIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
          
                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);
          
                  return builder
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("闹钟时间到")
                          .setContentText("正在响铃，点击进入关闭界面")
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setPriority(Notification.PRIORITY_MAX)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setFullScreenIntent(fullScreenIntent, true)
                          .setContentIntent(fullScreenIntent)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "关闭", stopPendingIntent)
                          .build();
              }
          
              private void startRound() {
                  round++;
                  vibrateAlarm();
                  playSound();
                  handler.removeCallbacks(stopOneRound);
                  handler.postDelayed(stopOneRound, 5 * 60 * 1000L);
              }
          
              private void playSound() {
                  stopSound();
                  SharedPreferences pref = getSharedPreferences(AlarmStore.PREF, MODE_PRIVATE);
                  String saved = pref.getString("alarmSoundUri", "");
                  Uri[] candidates = new Uri[]{
                          saved.isEmpty() ? null : Uri.parse(saved),
                          Settings.System.DEFAULT_ALARM_ALERT_URI,
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM),
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE),
                          RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                  };
                  for (Uri uri : candidates) {
                      if (uri != null && tryPlayUri(uri)) return;
                  }
                  startFallbackBeep();
              }
          
              private boolean tryPlayUri(Uri uri) {
                  try {
                      player = new MediaPlayer();
                      player.setDataSource(this, uri);
                      if (Build.VERSION.SDK_INT >= 21) {
                          player.setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build());
                      } else {
                          player.setAudioStreamType(AudioManager.STREAM_ALARM);
                      }
                      player.setLooping(true);
                      player.prepare();
                      player.start();
                      return true;
                  } catch (Exception e) {
                      if (player != null) {
                          try { player.release(); } catch (Exception ignored) {}
                          player = null;
                      }
                      return false;
                  }
              }
          
              private void startFallbackBeep() {
                  try {
                      toneGenerator = new ToneGenerator(AudioManager.STREAM_ALARM, 100);
                      fallbackBeep.run();
                  } catch (Exception ignored) {
                  }
              }
          
              private void vibrateAlarm() {
                  if (vibrator == null) return;
                  try {
                      vibrator.vibrate(new long[]{0, 700, 300, 700, 300, 700}, 0);
                  } catch (Exception ignored) {
                  }
              }
          
              private void stopSound() {
                  handler.removeCallbacks(fallbackBeep);
                  if (player != null) {
                      try {
                          if (player.isPlaying()) player.stop();
                          player.release();
                      } catch (Exception ignored) {
                      }
                      player = null;
                  }
                  if (toneGenerator != null) {
                      try { toneGenerator.release(); } catch (Exception ignored) {}
                      toneGenerator = null;
                  }
                  if (vibrator != null) {
                      try { vibrator.cancel(); } catch (Exception ignored) {}
                  }
              }
          
              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  stopSound();
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_AlarmRingingService_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/BootReceiver.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/BootReceiver.java' <<'EOF_app_src_main_java_com_trae_timeralarm_BootReceiver_java'
          package com.trae.timeralarm;
          
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;
                  AlarmScheduler.scheduleAll(context);
              }
          }
          EOF_app_src_main_java_com_trae_timeralarm_BootReceiver_java

          mkdir -p "$(dirname 'app/src/main/java/com/trae/timeralarm/MainActivity.java')"
          cat > 'app/src/main/java/com/trae/timeralarm/MainActivity.java' <<'EOF_app_src_main_java_com_trae_timeralarm_MainActivity_java'
          package com.trae.timeralarm;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.media.RingtoneManager;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.CompoundButton;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.TimePicker;
          
          import java.util.List;
          
          public class MainActivity extends Activity {
              private static final int PICK_AUDIO = 2001;
              private static final int PICK_RINGTONE = 2002;
              private final Handler handler = new Handler();
              private SharedPreferences pref;
          
              private TextView title;
              private TextView display;
